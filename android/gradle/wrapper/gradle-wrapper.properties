distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 走腾讯云镜像。原版是 https://services.gradle.org/distributions/...，
# 本机实测 services.gradle.org 是通的（307），但这个 all 包两百多兆，
# 镜像实测 206 / 0.5s 明显更快。
#
# 换镜像安全的前提：这里**没有** distributionSha256Sum。
# 有那行的话镜像上的包和官方包只要有一个字节不同就会校验失败。
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.14.3-all.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
